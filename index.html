<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <!-- Firebase App (core) and Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>

  <script>
    // 1. Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBcxvI-0nwMA6m1Vw91pkLpeUludgbR8Kc",
    authDomain: "premium-gweb.firebaseapp.com",
    projectId: "premium-gweb",
    storageBucket: "premium-gweb.firebasestorage.app",
    messagingSenderId: "242312398363",
    appId: "1:242312398363:web:a7008420a224e42692dabe",
    measurementId: "G-GG62F9B9QW"
    };
    firebase.initializeApp(firebaseConfig);

    // 2. Premium Gmail list
    const premiumEmails = ["youremail@gmail.com", "anotherpremium@gmail.com"];

    // 3. Sign in function
    function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          const email = user.email;

          // 4. Redirect based on email
          if (premiumEmails.includes(email)) {
            window.location.href = "premium.html";
          } else {
            window.location.href = "free.html";
          }
        })
        .catch((error) => {
          console.error("Login failed:", error.message);
          alert("Sign-in failed. Check the console for details.");
        });
    }
  </script>
</head>
<body>
  <h1>Sign in to Access</h1>
  <button onclick="signInWithGoogle()">Sign In with Google</button>
</body>
</html>
