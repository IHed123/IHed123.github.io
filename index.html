<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quikschool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen">
    <h2>Login</h2>

    <!-- Email/password form -->
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login with Email</button>

    <hr>

    <!-- Google button -->
    <button id="googleLoginBtn">Sign in with Google</button>

    <p id="error" style="color:red; display:none;">Login failed</p>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
