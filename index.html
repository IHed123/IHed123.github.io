<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
</head>
<body>
  <h1>Sign in to Access</h1>
  <button onclick="signInWithGoogle()">Sign In with Google</button>

  <script>
    // ✅ Replace these with your actual Firebase config:
    const firebaseConfig = {
      apiKey: "AIzaSyBcxvI-0nwMA6m1Vw91pkLpeUludgbR8Kc",
      authDomain: "premium-gweb.firebaseapp.com",
      projectId: "premium-gweb",
      appId: "1:242312398363:web:a7008420a224e42692dabe"
    };

    // ✅ Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // ✅ List of premium accounts
    const premiumEmails = ["isa@myhla.org", "anotherpremium@gmail.com"];

    // ✅ Sign in function
    function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then(result => {
          const email = result.user.email;
          console.log("Signed in as:", email);

          if (premiumEmails.includes(email)) {
            window.location.href = "premium.html";
          } else {
            window.location.href = "free.html";
          }
        })
        .catch(error => {
          console.error("Google sign-in error:", error);
          alert("Error during sign-in: " + error.message);
        });
    }
  </script>
</body>
</html>
