<!DOCTYPE html>
<html>
<head>
  <title>Play</title>
  <style>
    html, body, iframe {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    iframe {
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="gameFrame"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const gameurl = params.get("gameurl");
    if (gameurl) {
      document.getElementById("gameFrame").src = gameurl;
    } else {
      document.body.innerHTML = "<h1 style='color:white;'>Game not found</h1>";
    }
  </script>
</body>
</html>
